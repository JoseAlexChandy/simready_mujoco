# Scene composition for `srmj scene`.
# Assets come from `assets_from`; each is looked up in <output_dir>/<id>/*.xml.

assets_from: configs/subset.yaml
output: outputs/scene/scene.xml
sim_profile: manipulation

# Robots and grippers (category robot / gripper). Off for now; set true to add them back.
robots: false

# Default layout: a light-brown sheet on the floor, objects in rows on it
# (big items at the back, small ones in front).
sheet:
  rgba: [0.80, 0.68, 0.50, 1.0]   # light brown
  margin: 0.4                     # border around the objects, metres
  gap: 0.3                        # spacing between objects, metres

# Optional table layout instead of the sheet: big items on the floor, small ones on the
# table, robots on its left end. Set enabled: true to use it.
table:
  enabled: false
  length: 1.4
  width: 0.8
  height: 0.75

# Textures in the scene. Each costs width x height x 3 bytes of RAM (2048 px = 12 MB), so the
# scene uses scaled-down copies, cached in outputs/scene/textures (asset files unchanged).
# Lower max_size, or set enabled: false, if `make scene` runs out of memory ("Killed").
textures:
  enabled: true
  max_size: 1024      # px, longest side; 0 keeps the originals

# Doors, drawers and other moving parts without a motor get light damping and friction in
# the scene only (asset files unchanged), so they stay where you drag them in the viewer.
articulation:
  enabled: true
  damping: 0.5        # N·m·s/rad for hinges, N·s/m for sliders
  frictionloss: 0.05
  # Objects' motors (laptop lid, microwave door, air-fryer basket). compliant: the Control
  # panel sliders move them, but their force is capped so a drag overpowers them (let go and
  # the part returns to the slider). passive: motors off, dragged parts stay put. keep: as
  # converted. Robots and grippers always keep theirs.
  motors: compliant
  # Objects with moving parts grip the floor harder, so opening a door doesn't slide them.
  grip_friction: 1.5
  # Buttons, triggers and switches (slides up to 15 mm, hinges up to 10 deg) spring back
  # to rest when let go.
  momentary: true
  momentary_hz: 4.0

# Per-asset overrides: floor | table | robot | skip | [x, y, z]
# or on/in another asset: {in: ID, level: n, at: [x, y], upright: true, yaw: deg}
# (see src/simready_mujoco/sim/nesting.py). Containers need hollow colliders:
#   srmj set decompose concave <container ids>
place:
  example_cabinet: skip      # synthetic test asset

  # display shelf (d00326): bread basket on top, wicker baskets below
  d00081: {on: d00326, level: 1}     # bread basket
  d00323: {on: d00326, level: 2}     # round wicker basket
  d00395: {on: d00326, level: 3}     # wicker basket with handle
  d00363: {in: d00323}               # grapes
  d00364: {in: d00323}               # guava
  d00338: {in: d00395}               # ginger

  # bowl (d00270): fruit
  d00322: {in: d00270}               # apple
  d00123: {in: d00270}               # cherry

  # cutlery caddy (d00249): standing up, heavier end down
  d00253: {in: d00249, upright: true}   # knife
  d00247: {in: d00249, upright: true}   # fork
  d00314: {in: d00249, upright: true}   # fork
  d00315: {in: d00249, upright: true}   # carving fork
  d00380: {in: d00249, upright: true}   # spoon
  d00317: {in: d00249, upright: true}   # wooden spoon

  # breakfast
  d00080: {on: d00264}               # bread loaf on the cutting board
  d00084: {on: d00264}               # bread roll on the cutting board
  d00309: {on: d00268}               # croissant on the plate
  d00287: {in: d00288}               # egg in the egg carton
  d00199: {on: d00336}               # frying pan on the gas stove
  d00248: {in: d00274}               # cutlery set in the drying rack

# Optional rotation about the vertical axis, in degrees, per asset id
yaw: {}
